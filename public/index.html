<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f6f4" />
    <meta name="color-scheme" content="light" />
    <title>Echo</title>
    <link rel="stylesheet" href="./styles.min.css?v=20c6d00c59" />
  </head>
  <body>
    <section class="auth-screen" id="authScreen" aria-label="身份认证">
      <div class="auth-card">
        <div class="auth-branding">
          <img class="auth-logo" src="./echo-logo.png" alt="Echo" />
          <div>
            <p class="auth-eyebrow">Echo</p>
            <h1>进入私密会话</h1>
            <p class="auth-copy">登录后即可继续使用端到端加密聊天。</p>
          </div>
        </div>

        <div class="auth-tabs" role="tablist" aria-label="认证方式">
          <button class="auth-tab is-active" id="loginTab" type="button" data-mode="login">登录</button>
          <button class="auth-tab" id="registerTab" type="button" data-mode="register">注册</button>
        </div>

        <form class="auth-form" id="authForm">
          <div class="field">
            <label class="field-label" for="authUsernameInput">用户名</label>
            <input id="authUsernameInput" name="username" autocomplete="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]{3,24}" placeholder="请输入用户名" required />
          </div>

          <div class="field">
            <label class="field-label" for="authPasswordInput">密码</label>
            <input id="authPasswordInput" name="password" type="password" autocomplete="current-password" minlength="4" maxlength="72" placeholder="请输入密码" required />
          </div>

          <button class="primary-button auth-submit" id="authSubmitButton" type="submit">登录</button>
          <p class="auth-tip" id="authTip" role="status" aria-live="polite">请登录后继续使用加密会话。</p>
          <h2 class="sr-only" id="authHeading">登录 Echo</h2>
        </form>
      </div>
    </section>

    <section class="workspace" id="workspace" hidden aria-label="Echo 聊天工作台">
      <header class="topbar">
        <div class="topbar-brand">
          <img class="brand-logo" src="./echo-logo.png" alt="Echo" />
          <div class="brand-copy">
            <strong>Echo</strong>
            <span>私密聊天</span>
          </div>
        </div>

        <label class="topbar-search" aria-label="搜索消息或联系人">
          <span class="search-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7"></circle>
              <line x1="20" y1="20" x2="16.65" y2="16.65"></line>
            </svg>
          </span>
          <input id="globalSearchInput" type="search" placeholder="搜索消息或联系人" aria-controls="searchResultList conversationList pinnedConversationList" />
          <span class="topbar-search-shortcut" aria-hidden="true">Ctrl K</span>
        </label>

        <div class="topbar-actions">
          <button class="status-pill" type="button" aria-label="当前状态">
            <i class="online-dot is-online" aria-hidden="true"></i>
            <span>在线</span>
          </button>

          <button class="icon-button" type="button" id="settingsButton" aria-label="设置">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01A1.65 1.65 0 0 0 10.5 3.1V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"></path>
            </svg>
          </button>

          <div class="account-menu-wrap">
            <button class="user-chip user-chip-button" id="accountMenuButton" type="button" aria-haspopup="menu" aria-expanded="false">
              <div class="avatar avatar-tone-0" id="meAvatar">我</div>
              <div class="user-chip-copy">
                <strong id="meUsername">未登录</strong>
                <span class="user-chip-status">
                  <i class="user-chip-dot" id="meStatusDot" aria-hidden="true"></i>
                  <span id="meStatus" aria-live="polite">等待登录</span>
                </span>
              </div>
            </button>
            <div class="floating-menu" id="accountMenu" hidden>
              <button class="floating-menu-item" id="editAccountButton" type="button">编辑账号信息</button>
              <button class="floating-menu-item is-danger" id="logoutMenuButton" type="button">退出登录</button>
            </div>
          </div>

          <button class="ghost-button compact topbar-logout" id="logoutButton" type="button">退出登录</button>
          <button class="sr-only" id="logoutAllButton" type="button">退出全部设备</button>
        </div>
      </header>

      <div class="app-shell">
        <aside class="sidebar-nav" aria-label="主导航">
          <div class="sidebar-nav-main">
            <button class="nav-button is-active" id="navMessagesButton" type="button" data-nav-section="messages">
              <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
              </span>
              <span>消息</span>
            </button>
            <button class="nav-button" id="navContactsButton" type="button" data-nav-section="contacts">
              <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 1 0-16 0"></path><circle cx="12" cy="7" r="4"></circle></svg>
              </span>
              <span>联系人</span>
            </button>
          </div>

          <button class="sidebar-profile-button" id="sidebarProfileButton" type="button" aria-haspopup="menu" aria-expanded="false">
            <div class="avatar avatar-tone-0 sidebar-profile-avatar" id="sidebarProfileAvatar">张</div>
            <div class="sidebar-profile-copy">
              <strong id="sidebarProfileName">Echo</strong>
              <span id="sidebarProfileStatus">工作区</span>
            </div>
          </button>
        </aside>

        <aside class="sidebar" id="sidebar" aria-label="会话列表">
          <div class="sidebar-frame">
            <div class="sidebar-head">
              <div>
                <p class="eyebrow">会话列表</p>
                <h2>最近消息</h2>
              </div>
              <span id="sidebarMeta">0 个会话</span>
            </div>

            <div class="sidebar-search-row">
              <label class="sidebar-search" aria-label="搜索会话">
                <span class="search-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="20" y1="20" x2="16.65" y2="16.65"></line></svg>
                </span>
                <input id="sidebarSearchInput" type="search" placeholder="搜索会话" aria-controls="searchResultList conversationList pinnedConversationList" />
              </label>

              <button class="icon-button sidebar-search-filter" id="sidebarSearchButton" type="button" aria-label="聚焦搜索">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="7" y1="12" x2="17" y2="12"></line><line x1="10" y1="18" x2="14" y2="18"></line></svg>
              </button>
            </div>

            <div class="list-group" id="searchGroup" hidden>
              <div class="group-title-row"><div class="group-title">搜索结果</div></div>
              <div class="conversation-list" id="searchResultList"></div>
            </div>

            <div class="list-group" id="pinnedGroup" hidden>
              <div class="group-title-row"><div class="group-title">置顶</div></div>
              <div class="conversation-list" id="pinnedConversationList"></div>
            </div>

            <div class="list-group" id="recentGroup">
              <div class="group-title-row"><div class="group-title">最近消息</div></div>
              <div class="conversation-list" id="conversationList"></div>
            </div>

            <div class="sidebar-empty" id="conversationEmpty">
              <div class="sidebar-empty-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
              </div>
              <strong>暂无会话</strong>
              <span>在左上角搜索联系人，即可开始新的加密聊天。</span>
              <button class="ghost-button compact empty-search-button" id="emptySearchButton" type="button">搜索联系人</button>
            </div>
          </div>
        </aside>

        <main class="chat-panel" id="chatPanel" aria-label="聊天窗口">
          <section class="chat-empty" id="chatEmpty">
            <div class="chat-empty-illustration" aria-hidden="true"><svg class="chat-empty-illustration-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg></div>
            <p class="eyebrow">聊天窗口</p>
            <h2>选择一个会话开始查看消息</h2>
            <p>先生成整体界面，再继续补足详细的消息交互。</p>
          </section>

          <section class="chat-thread" id="chatThread" hidden>
            <header class="thread-header">
              <button class="icon-button mobile-back" id="mobileBackButton" type="button" aria-label="返回会话列表">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
              </button>

              <div class="thread-user">
                <div class="avatar avatar-tone-1" id="peerAvatar">林</div>
                <div class="thread-copy">
                  <strong id="peerName">未选择联系人</strong>
                  <span id="peerStatus">等待会话</span>
                </div>
              </div>

              <div class="thread-actions">
                <button class="icon-button" id="headerSearchButton" type="button" aria-label="搜索当前会话"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="20" y1="20" x2="16.65" y2="16.65"></line></svg></button>
                <button class="icon-button" id="headerCallButton" type="button" aria-label="发起语音通话"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.11 4.18 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.72c.12.9.34 1.78.65 2.62a2 2 0 0 1-.45 2.11L8 9.91a16 16 0 0 0 6.09 6.09l1.46-1.3a2 2 0 0 1 2.11-.45c.84.31 1.72.53 2.62.65A2 2 0 0 1 22 16.92z"></path></svg></button>
                <button class="icon-button" id="headerVideoButton" type="button" aria-label="发起视频通话"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg></button>
                <button class="icon-button" id="headerDetailsButton" type="button" aria-label="查看联系人详情"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></button>
              </div>
            </header>

            <div class="thread-tools">
              <label class="thread-search" aria-label="搜索当前会话消息">
                <span class="search-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="20" y1="20" x2="16.65" y2="16.65"></line></svg></span>
                <input id="threadSearchInput" type="search" placeholder="搜索当前会话" aria-controls="messageList" />
              </label>

              <div class="thread-tools-actions">
                <button class="ghost-button compact thread-action" id="pinPeerButton" type="button">置顶</button>
                <button class="ghost-button compact thread-action" id="mutePeerButton" type="button">免打扰</button>
                <button class="ghost-button compact thread-action" id="exportPeerButton" type="button">导出</button>
              </div>

              <div class="thread-search-meta" id="threadSearchMeta">显示全部消息</div>
            </div>

            <div class="security-status" id="securityStatus" aria-live="polite">请选择会话查看加密状态。</div>

            <div class="message-stream-shell">
              <div class="message-stream" id="messageList" aria-live="polite"></div>
              <div class="typing-indicator" id="typingIndicator" hidden>
                <div class="message-avatar avatar avatar-tone-1" id="typingAvatar" aria-hidden="true">林</div>
                <div class="typing-bubble" aria-label="对方正在输入"><span></span><span></span><span></span></div>
              </div>
              <button class="scroll-bottom-button" id="scrollBottomButton" type="button" aria-label="滚动到底部">
                <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
                <span class="count" id="scrollBottomCount" hidden></span>
              </button>
              <div class="message-context-menu floating-menu" id="messageContextMenu" hidden>
                <button class="floating-menu-item" id="contextCopyButton" type="button">复制消息</button>
                <button class="floating-menu-item is-danger" id="contextRecallButton" type="button">撤回消息</button>
              </div>
            </div>

            <form class="composer" id="composerForm">
              <div class="composer-reply" id="composerReplyBar" hidden>
                <div class="composer-reply-copy"><span>正在回复 <strong id="replyPreviewAuthor"></strong></span><p id="replyPreviewText"></p></div>
                <button id="cancelReplyButton" type="button" class="ghost-button compact">取消</button>
              </div>

              <div class="composer-main">
                <button class="icon-button composer-tool" type="button" data-composer-action="emoji" aria-label="插入表情">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8.5 14.5c.9 1.2 2.1 1.8 3.5 1.8s2.6-.6 3.5-1.8"></path><path d="M9 10h.01"></path><path d="M15 10h.01"></path></svg>
                </button>

                <label class="composer-field">
                  <textarea id="messageInput" rows="1" maxlength="4000" placeholder="输入消息..." required></textarea>
                  <span class="composer-hint" aria-hidden="true">回车发送，Shift + 回车换行</span>
                </label>

                <button class="primary-button send-button" id="sendButton" type="submit">
                  <span class="send-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg></span>
                  <span class="send-label">发送</span>
                </button>
              </div>

              <div class="emoji-panel" id="emojiPanel" hidden>
                <button class="emoji-chip" type="button" data-emoji-value="&#128512;">&#128512;</button>
                <button class="emoji-chip" type="button" data-emoji-value="&#128521;">&#128521;</button>
                <button class="emoji-chip" type="button" data-emoji-value="&#128077;">&#128077;</button>
                <button class="emoji-chip" type="button" data-emoji-value="&#127881;">&#127881;</button>
                <button class="emoji-chip" type="button" data-emoji-value="&#128206;">&#128206;</button>
                <button class="emoji-chip" type="button" data-emoji-value="&#128293;">&#128293;</button>
                <button class="emoji-chip" type="button" data-emoji-value="&#9989;">&#9989;</button>
                <button class="emoji-chip" type="button" data-emoji-value="&#10084;&#65039;">&#10084;&#65039;</button>
              </div>
            </form>
          </section>
        </main>

        <aside class="contact-panel" id="contactPanel" aria-label="联系人详情">
          <div class="contact-panel-header">
            <h2>联系人详情</h2>
            <button class="icon-button details-close" id="detailsCloseButton" type="button" aria-label="关闭联系人详情"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
          </div>

          <div class="contact-panel-body">
            <div class="contact-empty" id="contactDetailsEmpty">
              <div class="contact-empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 1 0-16 0"></path><circle cx="12" cy="7" r="4"></circle></svg></div>
              <strong>尚未选择联系人</strong>
              <span>右侧详情栏已预留，后续继续补齐头像、状态和会话选项。</span>
            </div>

            <div class="contact-details" id="contactDetailsContent" hidden>
              <section class="contact-profile-card">
                <div class="contact-profile-avatar-wrap"><div class="avatar avatar-tone-1 contact-profile-avatar" id="detailsAvatar">林</div><span class="contact-profile-dot" aria-hidden="true"></span></div>
                <strong id="detailsName">未选择联系人</strong>
                <span id="detailsStatus">离线</span>
                <p id="detailsRole">暂无简介</p>
              </section>

              <div class="detail-action-grid">
                <button class="detail-action is-active" type="button" data-detail-action="message"><span class="detail-action-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg></span><span>消息</span></button>
                <button class="detail-action" type="button" data-detail-action="call"><span class="detail-action-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.11 4.18 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.72c.12.9.34 1.78.65 2.62a2 2 0 0 1-.45 2.11L8 9.91a16 16 0 0 0 6.09 6.09l1.46-1.3a2 2 0 0 1 2.11-.45c.84.31 1.72.53 2.62.65A2 2 0 0 1 22 16.92z"></path></svg></span><span>电话</span></button>
                <button class="detail-action" type="button" data-detail-action="video"><span class="detail-action-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg></span><span>视频</span></button>
                <button class="detail-action" type="button" data-detail-action="more"><span class="detail-action-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1.4"></circle><circle cx="19" cy="12" r="1.4"></circle><circle cx="5" cy="12" r="1.4"></circle></svg></span><span>更多</span></button>
              </div>

              <section class="detail-block"><div class="detail-block-head"><h3>联系人简介</h3></div><p id="detailsAbout"></p></section>
              <section class="detail-block"><div class="detail-block-head"><h3>共享媒体</h3><button class="link-button" type="button">查看全部</button></div><div class="media-grid" id="detailsMediaGrid"></div></section>
              <section class="detail-block"><div class="detail-block-head"><h3>共享文件</h3><button class="link-button" type="button">查看全部</button></div><div class="detail-file-list" id="detailsFilesList"></div></section>
              <section class="detail-block">
                <div class="detail-block-head"><h3>会话选项</h3></div>
                <label class="switch-row" for="notificationsToggle">
                  <span class="switch-copy"><strong>消息通知</strong><small>关闭后当前会话进入免打扰</small></span>
                  <span class="switch"><input id="notificationsToggle" type="checkbox" /><span class="switch-slider"></span></span>
                </label>
              </section>
            </div>
          </div>
        </aside>
      </div>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.min.js?v=9eb06b4198" defer></script>
  </body>
</html>
