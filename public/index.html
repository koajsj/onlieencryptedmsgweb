<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d7e9e2" />
    <title>在线加密聊天</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="setup-panel" aria-label="会话侧栏">
        <div class="panel-header">
          <div class="brand-mark" aria-hidden="true">密</div>
          <div class="brand-copy">
            <strong>在线加密聊天</strong>
            <span>端到端加密，轻量直聊。</span>
          </div>
        </div>

        <label class="sidebar-search" aria-label="搜索会话">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="conversationSearchInput" type="search" placeholder="搜索房间或最近消息" />
        </label>

        <section class="sidebar-card conversation-section" aria-label="最近会话">
          <div class="section-head">
            <div>
              <div class="section-label">最近会话</div>
              <p class="section-subtitle">本机受保护记录。</p>
            </div>
          </div>
          <div class="conversation-list" id="conversationList"></div>
          <div class="sidebar-empty" id="conversationEmpty">还没有会话记录</div>
        </section>

        <form class="sidebar-card join-form" id="joinForm" aria-label="加入会话">
          <div class="section-head">
            <div>
              <div class="section-label">加入会话</div>
              <p class="section-subtitle">双方输入相同房间和口令。</p>
            </div>
          </div>

          <label class="field">
            <span>昵称</span>
            <input id="nameInput" name="name" maxlength="24" autocomplete="nickname" placeholder="你的名字" required />
          </label>

          <label class="field">
            <span>房间号</span>
            <input id="roomInput" name="room" maxlength="80" autocomplete="off" placeholder="例如 SECURE-A3F2" required />
          </label>

          <label class="field">
            <span>会话口令</span>
            <input
              id="secretInput"
              name="secret"
              type="password"
              minlength="8"
              autocomplete="new-password"
              placeholder="双方输入相同口令"
              required
            />
          </label>

          <div class="form-actions">
            <button class="primary-button" id="joinButton" type="submit">进入会话</button>
            <button class="ghost-button" id="randomRoomButton" type="button">随机房间</button>
          </div>
        </form>

        <section class="sidebar-card session-card" aria-label="会话状态">
          <div class="section-label">会话状态</div>
          <div class="info-row">
            <span>连接</span>
            <strong data-role="connection-state">未连接</strong>
          </div>
          <div class="info-row">
            <span>对方</span>
            <strong data-role="peer-state">等待加入</strong>
          </div>
          <div class="info-row">
            <span>加密</span>
            <strong data-role="crypto-state">未建立</strong>
          </div>
        </section>
      </aside>

      <main class="chat-panel" aria-label="聊天窗口">
        <header class="chat-header">
          <div class="chat-header-main">
            <div class="room-avatar" aria-hidden="true">#</div>
            <div class="chat-header-copy">
              <p class="eyebrow">加密会话</p>
              <h1 id="roomTitle">尚未进入房间</h1>
              <span class="subline" id="roomSubline">等待加入</span>
            </div>
          </div>

          <div class="chat-header-actions">
            <span class="chat-badge" id="connectionBadge">离线</span>
            <span class="chat-badge is-secondary" id="peerBadge">未配对</span>
            <button class="icon-button" id="toggleSearchButton" type="button" aria-label="搜索消息">⌕</button>
            <button class="icon-button" id="openInfoButton" type="button" aria-label="会话信息">ⓘ</button>
            <button class="ghost-button compact" id="leaveButton" type="button" disabled>离开</button>
          </div>
        </header>

        <section class="security-strip" aria-live="polite">
          <div class="security-copy">
            <span class="status-dot" id="secureDot"></span>
            <span id="secureText">输入房间号和口令后开始</span>
          </div>

          <div class="security-meta">
            <span class="crypto-badge" id="cryptoBadge" title="密钥信息">E2EE</span>
            <span class="chat-badge is-status" id="peerStatusBadge" hidden>对方在线</span>
            <output class="safety-code" id="safetyCode">----</output>
          </div>
        </section>

        <section class="message-search-bar" id="messageSearchBar" hidden aria-label="消息搜索">
          <label class="message-search-field">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input id="messageSearchInput" type="search" placeholder="搜索消息内容、文件名或引用片段" />
          </label>
          <div class="message-search-actions">
            <span class="search-count" id="messageSearchCount">0 / 0</span>
            <button class="icon-button" id="searchPrevButton" type="button" aria-label="上一个结果">↑</button>
            <button class="icon-button" id="searchNextButton" type="button" aria-label="下一个结果">↓</button>
            <button class="icon-button" id="closeSearchButton" type="button" aria-label="关闭搜索">×</button>
          </div>
        </section>

        <section class="messages" id="messageList" aria-live="polite" aria-label="消息列表">
          <div class="empty-state" id="emptyState">
            <strong>还没有消息</strong>
            <span>进入房间后开始聊天。</span>
          </div>

          <div class="typing-indicator" id="typingIndicator" hidden aria-label="对方正在输入">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </section>

        <form class="composer" id="messageForm">
          <div class="composer-card">
            <div class="composer-meta" id="composerMeta" hidden>
              <div class="composer-meta-copy">
                <strong id="composerMetaTitle"></strong>
                <span id="composerMetaText"></span>
              </div>
              <button class="icon-button" id="clearComposerMetaButton" type="button" aria-label="取消当前操作">×</button>
            </div>

            <div class="attachment-preview" id="attachmentPreview" hidden>
              <div class="attachment-preview-media" id="attachmentPreviewMedia"></div>
              <div class="attachment-preview-copy">
                <strong id="attachmentPreviewName"></strong>
                <span id="attachmentPreviewMeta"></span>
              </div>
              <button class="icon-button" id="removeAttachmentButton" type="button" aria-label="移除附件">×</button>
            </div>

            <div class="emoji-row" id="emojiRow">
              <button class="emoji-chip" data-emoji="👍" type="button">👍</button>
              <button class="emoji-chip" data-emoji="❤️" type="button">❤️</button>
              <button class="emoji-chip" data-emoji="😂" type="button">😂</button>
              <button class="emoji-chip" data-emoji="🎉" type="button">🎉</button>
            </div>

            <div class="composer-row">
              <button class="icon-button attach-button" id="attachButton" type="button" aria-label="添加附件">＋</button>
              <input id="attachmentInput" type="file" hidden />
              <textarea
                id="messageInput"
                rows="1"
                maxlength="1200"
                placeholder="等待加密会话建立"
                disabled
              ></textarea>
              <button class="primary-button send-button" id="sendButton" type="submit" disabled>发送</button>
            </div>
          </div>
        </form>

        <footer class="chat-footer">
          <span data-role="connection-state">未连接</span>
          <span class="footer-divider" aria-hidden="true"></span>
          <span data-role="crypto-state">未建立</span>
        </footer>
      </main>
    </div>

    <aside class="info-drawer" id="infoDrawer" hidden aria-label="会话信息" role="dialog" aria-modal="true" aria-labelledby="infoDrawerTitle">
      <div class="drawer-scrim" id="drawerScrim"></div>
      <div class="drawer-panel" data-dialog-panel tabindex="-1">
        <div class="drawer-head">
          <div>
            <div class="section-label">会话信息</div>
            <h2 id="infoDrawerTitle">当前房间</h2>
          </div>
          <button class="icon-button" id="closeInfoButton" type="button" aria-label="关闭">×</button>
        </div>

        <div class="drawer-card">
          <div class="info-row">
            <span>房间号</span>
            <strong id="infoRoom">-</strong>
          </div>
          <div class="info-row">
            <span>对方昵称</span>
            <strong id="infoPeer">-</strong>
          </div>
          <div class="info-row">
            <span>安全码</span>
            <strong id="infoSafety">----</strong>
          </div>
          <div class="info-row">
            <span>本地消息</span>
            <strong id="infoMessageCount">0</strong>
          </div>
        </div>

        <div class="drawer-actions">
          <button class="ghost-button" id="copyRoomButton" type="button">复制房间号</button>
          <button class="ghost-button" id="rekeyButton" type="button">重新协商密钥</button>
          <button class="ghost-button" id="clearLocalButton" type="button">清空本机记录</button>
          <button class="primary-button" id="drawerLeaveButton" type="button">离开会话</button>
        </div>
      </div>
    </aside>

    <section class="history-dialog" id="historyDialog" hidden aria-label="编辑历史" role="dialog" aria-modal="true" aria-labelledby="historyDialogTitle">
      <div class="dialog-scrim" id="historyScrim"></div>
      <div class="dialog-panel" data-dialog-panel tabindex="-1">
        <div class="drawer-head">
          <div>
            <div class="section-label">编辑历史</div>
            <h2 id="historyDialogTitle">消息版本</h2>
          </div>
          <button class="icon-button" id="closeHistoryButton" type="button" aria-label="关闭">×</button>
        </div>
        <div class="history-list" id="historyList"></div>
      </div>
    </section>

    <section class="confirm-dialog" id="confirmDialog" hidden aria-label="确认操作" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <div class="dialog-scrim" id="confirmScrim"></div>
      <div class="confirm-panel" data-dialog-panel tabindex="-1">
        <div class="drawer-head">
          <div>
            <div class="section-label">确认操作</div>
            <h2 id="confirmTitle">请确认</h2>
          </div>
        </div>
        <p class="confirm-text" id="confirmText"></p>
        <div class="confirm-actions">
          <button class="ghost-button" id="confirmCancelButton" type="button">取消</button>
          <button class="primary-button" id="confirmConfirmButton" type="button">确认</button>
        </div>
      </div>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./app.js" defer></script>
  </body>
</html>
